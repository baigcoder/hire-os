<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="HIRE.OS - Hiring decided on evidence. The operating system for modern hiring." />
  <meta name="keywords" content="hiring, recruitment, AI interviews, talent acquisition, job search, HR tech" />
  <meta name="author" content="HIRE.OS" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="HIRE.OS - Hiring decided on evidence" />
  <meta property="og:description"
    content="A hiring system where every rating cites the candidate's own words: structured scorecards, an interview copilot, blind screening and the owner's final call." />

  <!-- Type: General Sans (text and app) + Gambarino (landing display) -->
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />

  <!-- DNS Prefetch for external resources -->
  <link rel="dns-prefetch" href="https://api.cloudinary.com" />
  <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  <link rel="dns-prefetch" href="https://supabase.co" />

  <!-- Preconnect for API resources (early connection establishment) -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=gambarino@400&display=swap" rel="stylesheet" />

  <title>HIRE.OS - Hiring decided on evidence</title>

  <style>
    /* Critical CSS for faster loading */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        "General Sans",
        system-ui,
        -apple-system,
        sans-serif;
      background-color: #0a0a0a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #e1e1e1;
    }

    #root {
      min-height: 100vh;
    }

    /* Industrial Loading animation */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0a0a0a;
      gap: 20px;
    }

    .loading-brand {
      font-family: "General Sans", sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #efefef;
    }

    .loading-bar-container {
      width: 200px;
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      background: #b11226;
      animation: load 1.5s ease-out infinite;
    }

    @keyframes load {
      0% {
        width: 0%;
        transform: translateX(0);
      }

      50% {
        width: 100%;
        transform: translateX(0);
      }

      100% {
        width: 100%;
        transform: translateX(200px);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Industrial Loading state while React loads -->
    <div class="loading-screen">
      <span class="loading-brand">HIRE.OS</span>
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
